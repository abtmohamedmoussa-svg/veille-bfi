name: Brief Quotidien

on:
  schedule:
    # 05:00 UTC = 06:00 Tunis (UTC+1). Change "0 5" pour un autre horaire.
    - cron: "0 5 * * *"
  workflow_dispatch:   # bouton "Run workflow" pour tester a la main

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer et envoyer le brief quotidien
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python brief.py daily
      - name: ✅ Succès
        if: success()
        run: echo "[OK] Brief quotidien envoyé (HTML + Telegram + Archive)"
      - name: ❌ Erreur — Notifier Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": ${TELEGRAM_CHAT_ID}, \"text\": \"❌ Brief Quotidien ÉCHOUÉ\\nVérifier: ${GITHUB_RUN_URL}\"}"
