name: Veille Hebdo

on:
  schedule:
    # 20:00 UTC lundi = 21:00 Tunis (UTC+1) le lundi.
    - cron: "0 20 * * 1"
  workflow_dispatch:   # bouton "Run workflow" pour tester a la main

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Envoyer la veille hebdomadaire
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python brief.py weekly
