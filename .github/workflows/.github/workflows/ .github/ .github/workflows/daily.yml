name: Brief Quotidien

on:
  schedule:
    # 06:00 UTC = 07:00 Tunis (UTC+1). Change "0 6" pour un autre horaire.
    - cron: "0 6 * * *"
  workflow_dispatch:   # bouton "Run workflow" pour tester a la main

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Envoyer le brief quotidien
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python brief.py daily

