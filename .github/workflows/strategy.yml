name: Veille Stratégique Quotidienne

on:
  schedule:
    # 05:00 UTC = 06:00 Tunis (UTC+1) tous les jours.
    - cron: "0 5 * * *"
  workflow_dispatch:   # bouton "Run workflow" pour tester a la main

permissions:
  contents: write

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer et envoyer la veille stratégique
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_PAGES_URL: ${{ vars.GITHUB_PAGES_URL || 'https://abtmohamedmoussa-svg.github.io/veille-bfi/' }}
        run: python brief.py strategy
      - name: Commit et push les fichiers générés
        if: success()
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add index.html briefs.json archive.json 2>/dev/null || true
          git commit -m "🔄 Update briefs: $(date +%Y-%m-%d)" || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
      - name: ✅ Succès
        if: success()
        run: echo "[OK] Veille Stratégique envoyée + fichiers pushés"
      - name: ❌ Erreur — Notifier Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": ${TELEGRAM_CHAT_ID}, \"text\": \"❌ Veille Stratégique ÉCHOUÉE\\nVérifier: ${GITHUB_RUN_URL}\"}"
